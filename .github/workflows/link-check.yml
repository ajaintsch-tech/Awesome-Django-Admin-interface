name: Link check

on:
  schedule:
    - cron: '17 6 1 * *'   # monthly, 1st of the month
  workflow_dispatch:
  push:
    paths:
      - 'README.md'
      - '.github/workflows/link-check.yml'
      - '.lycheeignore'
  pull_request:
    paths:
      - 'README.md'

permissions:
  contents: read
  issues: write

jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 3 --timeout 30
            --accept 200,206,429
            README.md
          output: ./lychee/report.md
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show report in job summary
        run: cat ./lychee/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Open issue for broken links (scheduled runs only)
        if: steps.lychee.outputs.exit_code != 0 && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found by monthly link check
          content-filepath: ./lychee/report.md
          labels: link-check

      - name: Fail on broken links
        if: steps.lychee.outputs.exit_code != 0 && github.event_name != 'schedule'
        run: exit 1
